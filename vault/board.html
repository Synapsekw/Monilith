<style>
  /* Keystone Console — committed dark world (matches the app's dark-first identity). */
  body {

  @media (prefers-reduced-motion: reduce) { .led.red { animation: none; } }
</style>

<div class="wrap" id="app"></div>

<script>
  (function () {
    var app = document.getElementById("app");
    var data;
    try {
      data = JSON.parse(document.getElementById("board-data").textContent);
    } catch (e) {
      var err = document.createElement("div");
      err.className = "err";
      err.textContent = "board-data JSON failed to parse: " + e.message +
        " — re-run /board; the JSON island has a syntax error.";
      app.appendChild(err);
      return;
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    /* Header strip */
    var strip = el("div", "panel strip");
    var head = el("div", "headline");
    head.appendChild(el("span", "kicker", data.kicker || "PULSE"));
    head.appendChild(document.createTextNode(data.headline || ""));
    strip.appendChild(head);
    (data.chips || []).forEach(function (c) {
      var chip = el("span", "chip");
      chip.appendChild(document.createTextNode(c.label + " "));
      if (c.value) { chip.appendChild(el("b", null, c.value)); chip.appendChild(document.createTextNode(" ")); }
      if (c.note) chip.appendChild(el("span", c.tone || "ok", c.note));
      strip.appendChild(chip);
    });
    if (data.progress) {
      var frac = el("span", "frac", String(data.progress.done));
      frac.appendChild(el("span", null, "/" + data.progress.total));
      strip.appendChild(frac);
      var bar = el("div", "bar");
      var fill = el("i");
      fill.style.width = Math.round(100 * data.progress.done / data.progress.total) + "%";
      bar.appendChild(fill);
      strip.appendChild(bar);
    }
    var upd = el("span", "chip");
    upd.appendChild(document.createTextNode("upd "));
    upd.appendChild(el("b", null, data.updated || "?"));
    strip.appendChild(upd);
    app.appendChild(strip);

    /* Grid: gates + in-flight/session */
    var grid = el("div", "grid");

    var gatesPanel = el("div", "panel panel-pad");
    var h1 = el("h3", "ph");
    h1.appendChild(el("span", "kicker", "01"));
    h1.appendChild(document.createTextNode("Now / Owed"));
    gatesPanel.appendChild(h1);
    var ul = el("ul", "gates");
    (data.gates || []).forEach(function (g) {
      var li = el("li");
      li.appendChild(el("span", "led " + (g.led || "hollow")));
      li.appendChild(document.createTextNode(g.text));
      if (g.tag) li.appendChild(el("span", "tail", g.tag));
      ul.appendChild(li);
    });
    gatesPanel.appendChild(ul);
    grid.appendChild(gatesPanel);

    var side = el("div", "panel panel-pad");
    var h2 = el("h3", "ph");
    h2.appendChild(el("span", "kicker", "02"));
    h2.appendChild(document.createTextNode("In flight"));
    side.appendChild(h2);
    if ((data.worktrees || []).length === 0) {
      side.appendChild(el("div", "wt-none", "none building"));
    } else {
      data.worktrees.forEach(function (w) {
        var wt = el("div", "wt");
        wt.appendChild(el("span", "led " + (w.led || "amber")));
        wt.appendChild(document.createTextNode(w.branch));
        wt.appendChild(el("em", null, w.head + (w.note ? " · " + w.note : "")));
        side.appendChild(wt);
      });
    }
    if (data.session) {
      var h3 = el("h3", "ph");
      h3.style.marginTop = "14px";
      h3.appendChild(el("span", "kicker", "03"));
      h3.appendChild(document.createTextNode("Last session · " + (data.session.when || "")));
      side.appendChild(h3);
      var sl = el("ul", "sess");
      (data.session.bullets || []).forEach(function (b) { sl.appendChild(el("li", null, b)); });
      side.appendChild(sl);
      if (data.session.id) side.appendChild(el("div", "sess-id", "vault/sessions/" + data.session.id + ".md"));
    }
    grid.appendChild(side);
    app.appendChild(grid);

    /* Roadmap rail */
    var rail = el("div", "panel rail");
    (data.roadmap || []).forEach(function (s) {
      var stop = el("div", "stop " + (s.state || "future"));
      stop.appendChild(el("i", "dot"));
      stop.appendChild(el("span", null, s.label));
      rail.appendChild(stop);
    });
    app.appendChild(rail);

    var foot = el("footer", null,
      "derived view · sources: vault/00-north-star.md · git worktree list · vault/sessions/ · refreshed by /board (schema " + data.schema + ")");
    app.appendChild(foot);
  })();
</script>
