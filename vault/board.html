  .seg.part i {
    position: absolute; inset: 0 auto 0 0;
    background: var(--warn);
  }
  .meter-key {
    display: flex; gap: 14px; margin-top: 9px;
    font-family: var(--mono); font-size: 10px; color: var(--ink-low); letter-spacing: .04em;
  }
  .meter-key span { display: flex; align-items: center; gap: 5px; }
  .meter-key i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Pillars --------------------------------------------------------------- */
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pillar { padding: 15px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .pillar .top { display: flex; align-items: baseline; gap: 10px; }
  .pillar h3 { font-size: .88rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .pillar .pct {
    margin-left: auto;
    font-family: var(--mono);
    font-size: .82rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .pillar.partial .pct { color: var(--warn); }
  .track { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .pillar.partial .track i { background: var(--warn); }
  .pillar p { margin: 0; font-size: .79rem; color: var(--ink-mid); }
  .pillar .left {
    font-size: .76rem;
    color: var(--warn);
    border-top: 1px dashed rgba(251, 191, 36, .25);
    padding-top: 8px;
    margin-top: auto;
  }
  .pillar .left b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; display: block; color: rgba(251,191,36,.7); font-weight: 600; }

  /* Ship pipeline --------------------------------------------------------- */
  .ship { display: flex; align-items: stretch; flex-wrap: wrap; }
  .stage { flex: 1 1 220px; padding: 14px 18px; border-left: 1px solid var(--line); position: relative; }
  .stage:first-child { border-left: 0; }
  .stage .nm { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-low); }
  .stage .vl { font-family: var(--mono); font-size: .92rem; font-weight: 700; margin-top: 3px; display: flex; align-items: center; gap: 7px; }
  .stage .nt { font-size: .75rem; color: var(--ink-mid); margin-top: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 7px rgba(74, 222, 128, .5); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 7px rgba(251, 191, 36, .5); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 7px rgba(248, 113, 113, .6); }

  .gatebar {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 11px 18px; border-top: 1px solid var(--line); background: var(--raised);
    border-radius: 0 0 13px 13px;
  }
  .gate {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    color: var(--ink-mid); display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .gate b { color: var(--ink); font-weight: 600; }

  /* What's next: a ranked queue ------------------------------------------- */
  .queue { display: flex; flex-direction: column; }
  .qrow { display: flex; gap: 16px; padding: 15px 20px; border-top: 1px solid var(--line); }
  .qrow:first-child { border-top: 0; }
  .qrow .rank {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink-low);
    line-height: 1;
    width: 30px;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  .qrow:first-child .rank { color: var(--accent); }
  .qrow .body { flex: 1; min-width: 0; }
  .qrow h3 { font-size: .92rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
  .qrow p { margin: 0; font-size: .8rem; color: var(--ink-mid); max-width: 88ch; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-mid); border: 1px solid var(--line-lit); border-radius: 4px; padding: 2px 7px;
  }
  .tag.hot { color: var(--bad); border-color: rgba(248, 113, 113, .45); }

  /* Risks ----------------------------------------------------------------- */
  .risks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .risk { padding: 13px 15px 13px 16px; border-left-width: 3px; border-left-style: solid; }
  .risk.red { border-left-color: var(--bad); }
  .risk.amber { border-left-color: var(--warn); }
  .risk.open { border-left-color: var(--ink-low); }
  .risk h3 { font-size: .83rem; font-weight: 800; margin: 0 0 3px; display: flex; align-items: center; gap: 8px; }
  .risk.red h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px rgba(248,113,113,.8); animation: pulse 1.7s ease-in-out infinite; flex: none; }
  .risk p { margin: 0; font-size: .77rem; color: var(--ink-mid); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* Footer strip: session + in flight -------------------------------------- */
  .foot-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  .sess h3 { font-size: .86rem; font-weight: 800; margin: 4px 0 8px; }
  ul.bul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  ul.bul li { font-size: .79rem; color: var(--ink-mid); padding-left: 15px; position: relative; }
  ul.bul li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-d); }
  .path { font-family: var(--mono); font-size: 9.5px; color: var(--ink-low); margin-top: 10px; word-break: break-all; }
  .wt {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 11px; color: #c8c8cf;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--raised); margin-bottom: 6px;
  }
  .wt em { color: var(--ink-low); font-style: normal; margin-left: auto; font-size: 10px; padding-left: 10px; }
  .none { font-size: .8rem; color: var(--ink-low); }

  footer {
    font-family: var(--mono); font-size: 9.5px; color: #4c4c54;
    letter-spacing: .05em; text-align: center; margin-top: 6px;
  }

  .err {
    margin: 40px auto; max-width: 620px; padding: 20px;
    border: 1px solid rgba(248, 113, 113, .4); border-radius: 14px;
    color: var(--bad); font-family: var(--mono); font-size: 13px;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; }
    .hero .score { border-left: 0; border-top: 1px solid var(--line); }
    .pillars { grid-template-columns: repeat(2, 1fr); }
    .risks, .foot-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .pillars { grid-template-columns: 1fr; }
    .stage { border-left: 0; border-top: 1px solid var(--line); }
    .stage:first-child { border-top: 0; }
    .meter { gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .risk.red h3::before { animation: none; }
  }
</style>

<div class="wrap" id="app"></div>

<script>
  (function () {
    var app = document.getElementById("app");
    var data;

    try {
      data = JSON.parse(document.getElementById("board-data").textContent);
    } catch (e) {
      var err = document.createElement("div");
      err.className = "err";
      err.textContent = "board-data JSON failed to parse: " + e.message +
        " — re-run /board; the JSON island has a syntax error.";
      app.appendChild(err);
      return;
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) { n.className = cls; }
      if (text != null) { n.textContent = text; }
      return n;
    }

    function section(title, hint) {
      var h = el("div", "sec-head");
      h.appendChild(el("h2", null, title));
      if (hint) { h.appendChild(el("div", "hint", hint)); }
      app.appendChild(h);
    }

    /* ── Environment banner ─────────────────────────────────────────────── */
    if (data.environment) {
      var env = el("div", "env");
      env.appendChild(el("div", "mark", "ENV"));
      var envBody = el("div");
      envBody.appendChild(el("b", null, data.environment.title));
      envBody.appendChild(el("p", null, data.environment.text));
      env.appendChild(envBody);
      app.appendChild(env);
    }

    /* ── Hero: what we're building + how far along ──────────────────────── */
    var hero = el("div", "panel hero");
    var say = el("div", "say");
    say.appendChild(el("div", "kicker", (data.product && data.product.kicker) || "MONOLITH"));
    say.appendChild(el("h1", null, (data.product && data.product.thesis) || ""));
    if (data.product && data.product.stack) {
      say.appendChild(el("div", "stack", data.product.stack));
    }
    hero.appendChild(say);

    var stand = data.stand || {};
    var score = el("div", "score");
    score.appendChild(el("div", "kicker", "BUILD COMPLETE"));
    var big = el("div", "big", String(stand.percent != null ? stand.percent : "—"));
    big.appendChild(el("sup", null, "%"));
    score.appendChild(big);
    score.appendChild(el("div", "frac", stand.fraction || ""));
    if (stand.caption) { score.appendChild(el("div", "cap", stand.caption)); }

    var meter = el("div", "meter");
    (stand.meter || []).forEach(function (m) {
      var seg = el("div", "seg " + (m.state || "todo"));
      seg.title = m.label + (m.state === "part" ? " — " + (m.pct || 0) + "%" : m.state === "done" ? " — complete" : "");
      if (m.state === "part") {
        var fill = el("i");
        fill.style.width = (m.pct || 0) + "%";
        seg.appendChild(fill);
      }
      meter.appendChild(seg);
    });
    score.appendChild(meter);

    var key = el("div", "meter-key");
    [["done", "var(--accent)", "shipped"], ["part", "var(--warn)", "in progress"]].forEach(function (k) {
      var s = el("span");
      var sw = el("i");
      sw.style.background = k[1];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(k[2]));
      key.appendChild(s);
    });
    key.appendChild(el("span", null, "one segment = one roadmap track"));
    score.appendChild(key);
    hero.appendChild(score);
    app.appendChild(hero);

    /* ── What we're building, by capability ─────────────────────────────── */
    section("What we're building", "percent = slices shipped in that pillar");
    var pillars = el("div", "pillars");
    (data.pillars || []).forEach(function (p) {
      var card = el("div", "panel pillar" + (p.pct < 100 ? " partial" : ""));
      var top = el("div", "top");
      top.appendChild(el("h3", null, p.name));
      top.appendChild(el("div", "pct", p.pct + "%"));
      card.appendChild(top);

      var track = el("div", "track");
      var fill = el("i");
      fill.style.width = p.pct + "%";
      track.appendChild(fill);
      card.appendChild(track);

      card.appendChild(el("p", null, p.have));
      if (p.left) {
        var left = el("div", "left");
        left.appendChild(el("b", null, "still open"));
        left.appendChild(document.createTextNode(p.left));
        card.appendChild(left);
      }
      pillars.appendChild(card);
    });
    app.appendChild(pillars);

    /* ── Where the code is ──────────────────────────────────────────────── */
    section("Where it's shipped", "develop → main → production");
    var shipPanel = el("div", "panel");
    var ship = el("div", "ship");
    ((data.ship && data.ship.stages) || []).forEach(function (s) {
      var stage = el("div", "stage");
      stage.appendChild(el("div", "nm", s.name));
      var vl = el("div", "vl");
      vl.appendChild(el("span", "dot " + (s.tone || "ok")));
      vl.appendChild(document.createTextNode(s.value));
      stage.appendChild(vl);
      if (s.note) { stage.appendChild(el("div", "nt", s.note)); }
      ship.appendChild(stage);
    });
    shipPanel.appendChild(ship);

    var gatebar = el("div", "gatebar");
    ((data.ship && data.ship.gates) || []).forEach(function (g) {
      var gate = el("div", "gate");
      gate.appendChild(el("span", "dot " + (g.tone || "ok")));
      gate.appendChild(document.createTextNode(g.label + " "));
      gate.appendChild(el("b", null, g.value));
      gatebar.appendChild(gate);
    });
    shipPanel.appendChild(gatebar);
    app.appendChild(shipPanel);

    /* ── What's next, in order ──────────────────────────────────────────── */
    section("What's next", "ranked — top of the list is the next thing to do");
    var queue = el("div", "panel queue");
    (data.next || []).forEach(function (n, i) {
      var row = el("div", "qrow");
      row.appendChild(el("div", "rank", String(i + 1)));
      var body = el("div", "body");
      body.appendChild(el("h3", null, n.title));
      body.appendChild(el("p", null, n.why));
      if ((n.tags || []).length) {
        var tags = el("div", "tags");
        n.tags.forEach(function (t) {
          tags.appendChild(el("span", "tag" + (t === "critical" ? " hot" : ""), t));
        });
        body.appendChild(tags);
      }
      row.appendChild(body);
      queue.appendChild(row);
    });
    app.appendChild(queue);

    /* ── What could bite ────────────────────────────────────────────────── */
    section("Open risks", "standing conditions, not tasks");
    var risks = el("div", "risks");
    (data.risks || []).forEach(function (r) {
      var card = el("div", "panel risk " + (r.sev || "open"));
      card.appendChild(el("h3", null, r.title));
      card.appendChild(el("p", null, r.text));
      risks.appendChild(card);
    });
    app.appendChild(risks);

    /* ── Last session + in flight ───────────────────────────────────────── */
    section("Last session", data.updated ? "board refreshed " + data.updated : "");
    var foot = el("div", "foot-grid");

    var sess = el("div", "panel pad sess");
    if (data.session) {
      sess.appendChild(el("div", "kicker", data.session.when || ""));
      sess.appendChild(el("h3", null, data.session.title || ""));
      var ul = el("ul", "bul");
      (data.session.bullets || []).forEach(function (b) { ul.appendChild(el("li", null, b)); });
      sess.appendChild(ul);
      if (data.session.id) {
        sess.appendChild(el("div", "path", "vault/sessions/" + data.session.id + ".md"));
      }
    }
    foot.appendChild(sess);

    var flight = el("div", "panel pad");
    flight.appendChild(el("div", "kicker", "IN FLIGHT"));
    flight.appendChild(el("h3", null, "Building right now"));
    if (!(data.worktrees || []).length) {
      flight.appendChild(el("div", "none", "No worktrees open — nothing is mid-build."));
    } else {
      data.worktrees.forEach(function (w) {
        var wt = el("div", "wt");
        wt.appendChild(el("span", "dot " + (w.tone || "warn")));
        wt.appendChild(document.createTextNode(w.branch));
        wt.appendChild(el("em", null, w.head + (w.note ? " · " + w.note : "")));
        flight.appendChild(wt);
      });
    }
    foot.appendChild(flight);
    app.appendChild(foot);

    app.appendChild(el("footer", null,
      "derived view · sources: vault/00-north-star.md · git worktree list · vault/sessions/ · refreshed by /board · schema " + data.schema));
  })();
</script>
