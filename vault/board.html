    var app = document.getElementById("app");
    var data;

    try {
      data = JSON.parse(document.getElementById("board-data").textContent);
    } catch (e) {
      var err = document.createElement("div");
      err.className = "err";
      err.textContent = "board-data JSON failed to parse: " + e.message +
        " — re-run /board; the JSON island has a syntax error.";
      app.appendChild(err);
      return;
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) { n.className = cls; }
      if (text != null) { n.textContent = text; }
      return n;
    }

    function section(title, hint) {
      var h = el("div", "sec-head");
      h.appendChild(el("h2", null, title));
      if (hint) { h.appendChild(el("div", "hint", hint)); }
      app.appendChild(h);
    }

    /* ── Environment banner ─────────────────────────────────────────────── */
    if (data.environment) {
      var env = el("div", "env");
      env.appendChild(el("div", "mark", "ENV"));
      var envBody = el("div");
      envBody.appendChild(el("b", null, data.environment.title));
      envBody.appendChild(el("p", null, data.environment.text));
      env.appendChild(envBody);
      app.appendChild(env);
    }

    /* ── Hero: what we're building + how far along ──────────────────────── */
    var hero = el("div", "panel hero");
    var say = el("div", "say");
    say.appendChild(el("div", "kicker", (data.product && data.product.kicker) || "MONOLITH"));
    say.appendChild(el("h1", null, (data.product && data.product.thesis) || ""));
    if (data.product && data.product.stack) {
      say.appendChild(el("div", "stack", data.product.stack));
    }
    hero.appendChild(say);

    var stand = data.stand || {};
    var score = el("div", "score");
    score.appendChild(el("div", "kicker", "BUILD COMPLETE"));
    var big = el("div", "big", String(stand.percent != null ? stand.percent : "—"));
    big.appendChild(el("sup", null, "%"));
    score.appendChild(big);
    score.appendChild(el("div", "frac", stand.fraction || ""));
    if (stand.caption) { score.appendChild(el("div", "cap", stand.caption)); }

    var meter = el("div", "meter");
    (stand.meter || []).forEach(function (m) {
      var seg = el("div", "seg " + (m.state || "todo"));
      seg.title = m.label + (m.state === "part" ? " — " + (m.pct || 0) + "%" : m.state === "done" ? " — complete" : "");
      if (m.state === "part") {
        var fill = el("i");
        fill.style.width = (m.pct || 0) + "%";
        seg.appendChild(fill);
      }
      meter.appendChild(seg);
    });
    score.appendChild(meter);

    var key = el("div", "meter-key");
    [["done", "var(--accent)", "shipped"], ["part", "var(--warn)", "in progress"]].forEach(function (k) {
      var s = el("span");
      var sw = el("i");
      sw.style.background = k[1];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(k[2]));
      key.appendChild(s);
    });
    key.appendChild(el("span", null, "one segment = one roadmap track"));
    score.appendChild(key);
    hero.appendChild(score);
    app.appendChild(hero);

    /* ── What we're building, by capability ─────────────────────────────── */
    section("What we're building", "percent = slices shipped in that pillar");
    var pillars = el("div", "pillars");
    (data.pillars || []).forEach(function (p) {
      var card = el("div", "panel pillar" + (p.pct < 100 ? " partial" : ""));
      var top = el("div", "top");
      top.appendChild(el("h3", null, p.name));
      top.appendChild(el("div", "pct", p.pct + "%"));
      card.appendChild(top);

      var track = el("div", "track");
      var fill = el("i");
      fill.style.width = p.pct + "%";
      track.appendChild(fill);
      card.appendChild(track);

      card.appendChild(el("p", null, p.have));
      if (p.left) {
        var left = el("div", "left");
        left.appendChild(el("b", null, "still open"));
        left.appendChild(document.createTextNode(p.left));
        card.appendChild(left);
      }
      pillars.appendChild(card);
    });
    app.appendChild(pillars);

    /* ── Where the code is ──────────────────────────────────────────────── */
    section("Where it's shipped", "develop → main → production");
    var shipPanel = el("div", "panel");
    var ship = el("div", "ship");
    ((data.ship && data.ship.stages) || []).forEach(function (s) {
      var stage = el("div", "stage");
      stage.appendChild(el("div", "nm", s.name));
      var vl = el("div", "vl");
      vl.appendChild(el("span", "dot " + (s.tone || "ok")));
      vl.appendChild(document.createTextNode(s.value));
      stage.appendChild(vl);
      if (s.note) { stage.appendChild(el("div", "nt", s.note)); }
      ship.appendChild(stage);
    });
    shipPanel.appendChild(ship);

    var gatebar = el("div", "gatebar");
    ((data.ship && data.ship.gates) || []).forEach(function (g) {
      var gate = el("div", "gate");
      gate.appendChild(el("span", "dot " + (g.tone || "ok")));
      gate.appendChild(document.createTextNode(g.label + " "));
      gate.appendChild(el("b", null, g.value));
      gatebar.appendChild(gate);
    });
    shipPanel.appendChild(gatebar);
    app.appendChild(shipPanel);

    /* ── What's next, in order ──────────────────────────────────────────── */
    section("What's next", "ranked — top of the list is the next thing to do");
    var queue = el("div", "panel queue");
    (data.next || []).forEach(function (n, i) {
      var row = el("div", "qrow");
      row.appendChild(el("div", "rank", String(i + 1)));
      var body = el("div", "body");
      body.appendChild(el("h3", null, n.title));
      body.appendChild(el("p", null, n.why));
      if ((n.tags || []).length) {
        var tags = el("div", "tags");
        n.tags.forEach(function (t) {
          tags.appendChild(el("span", "tag" + (t === "critical" ? " hot" : ""), t));
        });
        body.appendChild(tags);
      }
      row.appendChild(body);
      queue.appendChild(row);
    });
    app.appendChild(queue);

    /* ── What could bite ────────────────────────────────────────────────── */
    section("Open risks", "standing conditions, not tasks");
    var risks = el("div", "risks");
    (data.risks || []).forEach(function (r) {
      var card = el("div", "panel risk " + (r.sev || "open"));
      card.appendChild(el("h3", null, r.title));
      card.appendChild(el("p", null, r.text));
      risks.appendChild(card);
    });
    app.appendChild(risks);

    /* ── Last session + in flight ───────────────────────────────────────── */
    section("Last session", data.updated ? "board refreshed " + data.updated : "");
    var foot = el("div", "foot-grid");

    var sess = el("div", "panel pad sess");
    if (data.session) {
      sess.appendChild(el("div", "kicker", data.session.when || ""));
      sess.appendChild(el("h3", null, data.session.title || ""));
      var ul = el("ul", "bul");
      (data.session.bullets || []).forEach(function (b) { ul.appendChild(el("li", null, b)); });
      sess.appendChild(ul);
      if (data.session.id) {
        sess.appendChild(el("div", "path", "vault/sessions/" + data.session.id + ".md"));
      }
    }
    foot.appendChild(sess);

    var flight = el("div", "panel pad");
    flight.appendChild(el("div", "kicker", "IN FLIGHT"));
    flight.appendChild(el("h3", null, "Building right now"));
    if (!(data.worktrees || []).length) {
      flight.appendChild(el("div", "none", "No worktrees open — nothing is mid-build."));
    } else {
      data.worktrees.forEach(function (w) {
        var wt = el("div", "wt");
        wt.appendChild(el("span", "dot " + (w.tone || "warn")));
        wt.appendChild(document.createTextNode(w.branch));
        wt.appendChild(el("em", null, w.head + (w.note ? " · " + w.note : "")));
        flight.appendChild(wt);
      });
    }
    foot.appendChild(flight);
    app.appendChild(foot);

    app.appendChild(el("footer", null,
      "derived view · sources: vault/00-north-star.md · git worktree list · vault/sessions/ · refreshed by /board · schema " + data.schema));
  })();
</script>
