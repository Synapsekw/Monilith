name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Placeholder public env so env validation + build pass without real secrets.
      # CI runs the unit project only (`pnpm test:unit`); the live-DB integration
      # suites are not exercised here (they're gated locally by finish-task.sh),
      # so loading them here only added global-setup network overhead.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  lighthouse:
    name: lighthouse (perf budget)
    runs-on: ubuntu-latest
    env:
      # Same placeholder public env as `verify` — the budget is asserted against
      # the static landing route (/), which is auth-free and deterministic in CI.
      # Authenticated routes need a live session + Supabase and are measured by
      # the real-user Web-Vitals layer instead (see src/components/web-vitals.tsx).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # lhci autorun: collects 3 runs against `next start` (startServerCommand in
      # .lighthouserc.json) and reports the Phase-9 budget. Assertions are "warn"
      # level (informational) — synthetic Lighthouse on a shared CI runner is too
      # noisy to block (lab TBT is CPU-contention-dominated); the real Web-Vitals
      # budget is enforced by the field/RUM layer (src/components/web-vitals.tsx).
      # Regressions surface as warnings in the log without failing the job.
      - name: Lighthouse CI
        run: pnpm exec lhci autorun

  commitlint:
    name: commitlint (PR)
    runs-on: ubuntu-latest
    # Skip for Dependabot — its generated "Bump …" subjects aren't Conventional Commits.
    # Skip on develop→main promotion PRs: those re-lint the whole develop history,
    # which was already linted commit-by-commit on the way into develop.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.base_ref != 'main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  changelog:
    name: changelog (drift)
    runs-on: ubuntu-latest
    # Only meaningful where granular history exists. main is squashed.
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate changelog
        run: pnpm changelog:gen

      - name: Fail if changelog is stale
        run: git diff --exit-code src/lib/changelog/generated.ts
